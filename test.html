<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LevelRegion Mermaid Graph Renderer</title>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    window.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('inputData');
      const renderBtn = document.getElementById('renderBtn');
      const exportBtn = document.getElementById('exportPdfBtn');
      const graphDiv = document.getElementById('graphDiv');

      function normalizeRef(ref) {
        ref = ref.trim();
        if (ref === '0') return 'O';
        if (ref.startsWith('REGION_INDICIES.')) {
          return ref.slice('REGION_INDICIES.'.length);
        }
        return ref;
      }

      function extractLogicLabel(value, isChaos = false) {
        if (!value) return "";
        const short = value.trim().split('.').pop().replace(/^option_/, '');
        if (!isChaos && short === "normal") return "";
        return isChaos ? `${short} chaos` : short;
      }

      function parseAndRender(text) {
        const regex = /LevelRegion\([^)]*\)([\s\S]*?)(?=LevelRegion\(|$)/g;
const regionNameRegex = /LevelRegion\([^,]+,\s*REGION_INDICIES\.([A-Z0-9_]+),\s*REGION_RESTRICTION_TYPES\.(?:(RegionAccess)\(REGION_INDICIES\.([A-Z0-9_]+)\)|([A-Za-z0-9_]+))?\)/;

        const regions = {};
        let match;
        let order = 0;

        while ((match = regex.exec(text)) !== null) {
          const fullBlock = match[0];
          const body = match[1];

          const regionMatch = regionNameRegex.exec(fullBlock);
          if (!regionMatch) continue;

          const regionName = regionMatch[1];
		  let restriction, regionAccessDependency = null;

			if (regionMatch[2] === "RegionAccess") {
			  restriction = "RegionAccess";
			  regionAccessDependency = regionMatch[3];
			} else {
			  restriction = regionMatch[4];
			}


          let from = null;
          const fromMatch = body.match(/\.setFromRegion\(([^)]+)\)/);
          if (fromMatch) {
            let cleaned = fromMatch[1].trim();
            if (cleaned.startsWith('[') && cleaned.endsWith(']')) {
              cleaned = cleaned.slice(1, -1);
              from = cleaned.split(',').map(s => normalizeRef(s));
            } else {
              from = [normalizeRef(cleaned)];
            }
          }

          let baseLogic = null;
          let chaosLogic = null;
          const logicMatch = body.match(/\.setLogicType\(([^,)\s]+)(?:\s*,\s*([^)]+))?\)/);
		  console.log("LGM", logicMatch);
          if (logicMatch) {
            baseLogic = logicMatch[1].trim();
            if (logicMatch[2])
			{
				chaosLogic = logicMatch[2].trim();
			}
          }

          const isHardOnly = /\.setHardLogicOnly\(\)/.test(body);

          regions[regionName] = {
            from,
            restriction,
			regionAccessDependency,
            baseLogic,
            chaosLogic,
            isHardOnly,
            order: order++
          };
		  
		  console.log(regions[regionName]);
        }

        if (Object.keys(regions).length === 0) {
          alert("No valid LevelRegion entries found in input.");
          return "";
        }

        const allRegions = Object.entries(regions).sort((a, b) => a[1].order - b[1].order);
		
		console.log("all regions=", allRegions);

        const firstRegion = allRegions[0][0];

        for (let i = 0; i < allRegions.length; i++) {
          const [region, info] = allRegions[i];
          if (info.from === null) {
            if (i === 0) continue;
            info.from = [allRegions[i - 1][0]];
          }
        }

        const lines = [];
        lines.push("graph TD");
        lines.push(`    O["Origin (0)"]`);
        lines.push(`    O --> ${firstRegion}["${firstRegion}\\n(Restriction: ${regions[firstRegion].restriction})"]`);

for (const [region, info] of allRegions) {
		console.log("AR", region, info)
		  //if (region === firstRegion) continue;
		  const label = `${region}\\n(Restriction: ${info.restriction})`;
		  const fromList = info.from || ['O'];

		  // Add edges from normal 'from' regions
		  //for (const from of fromList) {
			for (const from of fromList) {
            if (info.isHardOnly) {
              lines.push(`    ${from} -->|hard only| ${region}["${label}"]`);
            } else {
              const baseLabel = extractLogicLabel(info.baseLogic);
              const chaosLabel = extractLogicLabel(info.chaosLogic, true);
			  
			  console.log("LB", info, baseLabel, chaosLabel);

              if (baseLabel && chaosLabel) {
                lines.push(`    ${from} -->|${baseLabel}| ${region}["${label}"]`);
                lines.push(`    ${from} -->|${chaosLabel}| ${region}["${label}"]`);
              } else if (baseLabel) {
                lines.push(`    ${from} -->|${baseLabel}| ${region}["${label}"]`);
              } else if (chaosLabel) {
                lines.push(`    ${from} -->|${chaosLabel}| ${region}["${label}"]`);
              } else {
                lines.push(`    ${from} --> ${region}["${label}"]`);
              }
            }
          }
		  //}

		  // Add edge from RegionAccess dependency, if present and not already in fromList
		  if (info.regionAccessDependency && !fromList.includes(info.regionAccessDependency)) {
			lines.push(`    ${info.regionAccessDependency} -->|RegionAccess| ${region}["${label}"]`);
		  }
		}

		console.log("Lines ==", lines);
        return lines.join("\n");
      }

      renderBtn.addEventListener('click', () => {
        const text = input.value.trim();
        if (!text) {
          alert("Please paste your LevelRegion data first.");
          return;
        }

        try {
          const graphDefinition = parseAndRender(text);
          if (!graphDefinition) {
            graphDiv.innerHTML = "";
            return;
          }

          graphDiv.innerHTML = "";
          const graphContent = document.createElement("div");
          graphContent.className = "mermaid";
          graphContent.textContent = graphDefinition;
          graphDiv.appendChild(graphContent);

          mermaid.init(undefined, graphContent);
        } catch (e) {
          alert("Error parsing input or rendering graph: " + e.message);
          graphDiv.innerHTML = "";
        }
      });

      exportBtn.addEventListener('click', () => {
  const element = document.getElementById('graphDiv');
  const opt = {
    margin:       0,
    filename:     'levelregion-graph.pdf',
    image:        { type: 'jpeg', quality: 1.0 },
    html2canvas:  { scale: 3 }, // Increase quality
    jsPDF:        { unit: 'px', format: [2000, 1200] } // match CSS size
  };
  html2pdf().set(opt).from(element).save();
});


    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f0f0f0;
    }
    textarea {
      width: 100%;
      height: 240px;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
      box-sizing: border-box;
      margin-bottom: 12px;
      resize: vertical;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 8px;
    }
#graphDiv {
  margin: 40px auto;
  background: white;
  padding: 15px;
  border: 1px solid #ccc;
  overflow-x: auto;
  min-height: 300px;
  width: 2000px; /* Force wide rendering */
}
    }
  </style>
</head>
<body>

<h1>LevelRegion Mermaid Graph Renderer</h1>
<p>Paste your <code>LevelRegion(...)</code> data below and click <strong>Render Graph</strong>.</p>

<textarea id="inputData" placeholder="Paste your LevelRegion(...) code here..."></textarea>
<button id="renderBtn">Render Graph</button>
<button id="exportPdfBtn">Export to PDF</button>

<div id="graphDiv"></div>

</body>
</html>
